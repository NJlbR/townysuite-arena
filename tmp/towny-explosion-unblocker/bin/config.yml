# ========================================================
# TownyExplosionUnblocker Configuration
# ========================================================
# Этот плагин разблокирует разрушение блоков в городах
# ИСКЛЮЧИТЕЛЬНО для снарядов осадных МОРТИР и ТОЛЬКО во время АКТИВНОГО ШТУРМА (2ч)!
#
# Вся ванильная взрывчатка (динамит игроков, криперы, кристаллы Энда,
# кровати, якоря возрождения, визеры), а также обычные пушки вне штурма
# на 100% БЛОКИРУЮТСЯ и не могут нанести ни единого повреждения городу!

enabled: true

# Включать ли подробные логи в консоль сервера
debug-logging: false

# Интеграция с плагином TownySieges (активные осады)
siege-integration:
  # Разрешать взрывы в городах ТОЛЬКО во время активного 2-часового штурма (ACTIVE_SIEGE)
  require-active-siege: true

# Настройки детекции осадных мортир
detection:
  # Ключевые метаданные для распознавания снарядов мортиры
  mortar-metadata-keys:
    - "mortar"
    - "mortar_shell"
    - "siege_mortar"
    - "is_mortar"
    - "townysieges:mortar"
    - "cannons:mortar"

# Настройки взрывов осадных орудий
explosion:
  # Оповещать ли жителей города о попадании снаряда мортиры
  notify-town-residents: true
  resident-alert-message: "&c[!] &6Осадная мортира пробила укрепления на территории города!"
