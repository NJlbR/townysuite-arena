# ========================================================
# TownySieges Configuration
# ========================================================
# Плагин тактических осад, осадных лагерей, таймеров штурма,
# почанкового захвата штурмовым флагом и Войн Наций для Towny.
#
# Механика Войн Наций:
# 1. Глава первой нации объявляет войну другой нации:
#    /siege nationwar declare <Нация>
# 2. ВСЕ города обеих наций переводятся в режим подготовки к штурму (24 часа)
#    с ЕДИНЫМ для всех городов обеих наций таймером.
# 3. Во время подготовки и штурма города обеих наций могут ставить осадные лагеря
#    друг на друга, и осада не будет начинаться с нуля, а будет продолжать таймер нации.
# 4. При штурме на 2 часа ВСЕ города обеих наций становятся уязвимы к взрывам орудий!
#
# Механика Почанкового Захвата (Chunk Capture System):
# - Во время активного 2-часового штурма атакующие ставят кастомный Штурмовой Флаг
#   на чанк диких земель или атакуемого города, ГРАНИЧАЩИЙ с осадным лагерем.
# - Базовое время захвата: 5 минут (300 сек).
# - Скорость захвата динамически рассчитывается от перевеса атакующих:
#   чем больше атакующих на чанке, тем быстрее падет чанк!
# - Установленный флаг издает громкий звук и создает луч маяка в небо.
# - Игрокам на чанке выводится BossBar с числом бойцов и прогрессом.
# - Если защитников больше, прогресс откатывается. При уходе в минус чанк
#   переходит защищающемуся городу (при отсутствии смежности становится официальным Аванпостом Towny!).
# - Разрешено захватывать несколько чанков одновременно.

enabled: true
debug-logging: false

siege:
  # Время подготовки до начала штурма в секундах (86400 сек = 24 часа)
  preparation-duration-seconds: 86400

  # Длительность активной фазы штурма в секундах (7200 сек = 2 часа)
  active-duration-seconds: 7200

  # Дистанция от ближайших чанков города-цели для установки осадного лагеря (в чанках)
  min-distance-chunks: 3.0
  max-distance-chunks: 10.0

  # Максимальное количество чанков в одном осадном лагере
  max-siege-chunks-per-camp: 8

  # Экономические настройки (списание из казны атакующего города)
  economy:
    initial-camp-cost: 15000.0
    expand-chunk-cost: 10000.0
    daily-upkeep-per-chunk: 2500.0

nationwar:
  enabled: true
  # Единое время подготовки к штурму для всех городов обеих наций (24 часа)
  preparation-duration-seconds: 86400
  # Единое время активного штурма, когда все города уязвимы к взрывам (2 часа)
  assault-duration-seconds: 7200

# Настройки почанкового захвата штурмовым флагом (Chunk Capture)
capture:
  enabled: true
  # Базовое время захвата чанка в секундах (300 сек = 5 минут)
  base-capture-duration-seconds: 300
  # Разрешить захватывать сразу несколько чанков одновременно
  allow-simultaneous-chunks: true
  # Максимальный коэффициент ускорения захвата при колоссальном перевесе атакующих
  advantage-multiplier-cap: 5.0
  # Визуальный вертикальный луч маяка из флага в небо
  beacon-beam-enabled: true
  # Рецепт верстака 3x3 для штурмового флага
  custom-recipe-enabled: true
  # Если прогресс опускается ниже нуля при защите — создавать официальный аванпост Towny (при несмежности)
  outpost-creation-enabled: true

# Настройки Боссбара (BossBar) с таймером обратного отсчета
bossbar:
  enabled: true
  color-prep: "YELLOW"
  color-active: "RED"
  style-prep: "SEGMENTED_10"
  style-active: "SOLID"
